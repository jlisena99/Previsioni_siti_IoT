<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #484646; 
            color: white; 
            font-size: 12px;
        }
        #table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table { 
            border-collapse: collapse; 
            width: 100%; 
        }
        th, td { 
            border: 1px solid #6c6c6c; 
            padding: 6px; 
            text-align: center; 
            vertical-align: middle;
            white-space: nowrap;
        }
        th { background-color: #333333; color: white; font-weight: bold; font-size: 11px; }
        svg { width: 20px; height: 20px; display: block; margin: 0 auto; min-width: 20px; }
    </style>
</head>
<body>
    <div id="table-container">Caricamento...</div>

    <script>
        const faceGreen = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#4caf50" /><circle cx="35" cy="40" r="5" fill="white" /><circle cx="65" cy="40" r="5" fill="white" /><path d="M 30 65 Q 50 85 70 65" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" /></svg>';
        const faceYellow = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#ffb300" /><circle cx="35" cy="40" r="5" fill="white" /><circle cx="65" cy="40" r="5" fill="white" /><path d="M 35 65 L 65 65" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" /></svg>';
        const faceRed = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#e53935" /><circle cx="35" cy="40" r="5" fill="white" /><circle cx="65" cy="40" r="5" fill="white" /><path d="M 30 75 Q 50 55 70 75" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" /></svg>';

        fetch('dashboard_data.json')
            .then(response => response.json())
            .then(data => {
                const siteData = data['Cetara_Chiesa'];
                if (!siteData || siteData.length === 0) {
                    document.getElementById('table-container').innerHTML = '<div style="padding:10px;">Nessun dato.</div>';
                    return;
                }
                
                let days = [];
                for (let s of siteData) {
                    if (s.forecast && s.forecast.length > 0) {
                        days = s.forecast.map(f => f.day_str.replace('<br/>', ' '));
                        break;
                    }
                }
                
                let html = '<table>';
                html += '<tr><th>Stanza</th><th>Sensore</th>';
                days.forEach(d => html += '<th>' + d + '</th>');
                html += '</tr>';
                
                siteData.forEach(sensor => {
                    html += '<tr>';
                    html += '<td>' + sensor.room + '</td>';
                    html += '<td style="font-size:10px; color:#ccc;">' + sensor.sensor_id + '</td>';
                    
                    if (sensor.forecast && sensor.forecast.length > 0) {
                        sensor.forecast.forEach(f => {
                            let face = f.status === 'green' ? faceGreen : (f.status === 'yellow' ? faceYellow : faceRed);
                            html += '<td>' + face + '</td>';
                        });
                    } else {
                        html += '<td colspan="7">N.D.</td>';
                    }
                    html += '</tr>';
                });
                
                html += '</table>';
                document.getElementById('table-container').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('table-container').innerHTML = '<div style="padding:10px;">Errore: ' + err + '</div>';
            });
    </script>
</body>
</html>
