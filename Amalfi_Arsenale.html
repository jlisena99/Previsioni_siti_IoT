<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard Previsioni - Amalfi_Arsenale</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; color: #0d47a1; }
    </style>
</head>
<body>
    <div id="table-container">Caricamento dati...</div>

    <script>
        fetch('dashboard_data.json')
            .then(response => response.json())
            .then(data => {
                const siteData = data['Amalfi_Arsenale'];
                if (!siteData || siteData.length === 0) {
                    document.getElementById('table-container').innerHTML = '<p style="padding:20px;">Nessun dato disponibile.</p>';
                    return;
                }
                
                let days = [];
                for (let s of siteData) {
                    if (s.forecast && s.forecast.length > 0) {
                        days = s.forecast.map(f => f.day_str);
                        break;
                    }
                }
                
                let html = '<table>';
                html += '<tr><th>Nome Stanza</th><th>ID Sensore</th>';
                days.forEach(d => html += '<th>' + d + '</th>');
                html += '</tr>';
                
                siteData.forEach(sensor => {
                    html += '<tr>';
                    html += '<td>' + sensor.room + '</td>';
                    html += '<td>' + sensor.sensor_id + '</td>';
                    
                    if (sensor.forecast && sensor.forecast.length > 0) {
                        sensor.forecast.forEach(f => {
                            let emoji = f.status === 'green' ? '🟢' : (f.status === 'yellow' ? '🟡' : '🔴');
                            html += '<td style="font-size: 1.5em;">' + emoji + '</td>';
                        });
                    } else {
                        html += '<td colspan="7">Dati non disponibili</td>';
                    }
                    html += '</tr>';
                });
                
                html += '</table>';
                document.getElementById('table-container').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('table-container').innerHTML = '<p style="padding:20px;">Errore nel caricamento dei dati: ' + err + '</p>';
            });
    </script>
</body>
</html>
